name: Download monthly train data

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in YYYYMM format'
        required: true
        default: '202609'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download both datasets
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
          DATA_MONTH: ${{ inputs.month }}
        run: python scripts/download_monthly.py
      - name: Make datasets downloadable
        uses: actions/upload-artifact@v4
        with:
          name: train-data-${{ inputs.month }}
          path: downloads/
          if-no-files-found: error
          retention-days: 30
