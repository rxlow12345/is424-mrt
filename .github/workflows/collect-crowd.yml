name: Collect MRT crowd density

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mrt-crowd-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect observations
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: python scripts/log_crowd_density.py


      - name: Commit updated CSV
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/crowd_density_log.csv

          if git diff --cached --quiet; then
            echo "No new observations to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "data: append MRT crowd observations"
                    for attempt in 1 2 3 4; do
            if git pull --rebase origin "$DEFAULT_BRANCH" &&
               git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              echo "Save failed; retrying in 15 seconds."
              sleep 15
            fi
          done

          echo "Unable to save CSV after four attempts."
          exit 1
